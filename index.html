<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wulkanizacja, Geometria 3D & Piaskowanie | Serwis Walczykiewicz Ostrzeszów, Kępno, Syców, Ostrów Wlkp.</title>
    <link rel="icon" type="image/png" href="icon.png">
    
    <meta name="description" content="Profesjonalna wulkanizacja, geometria 3D Invento, lakiernia proszkowa oraz precyzyjne piaskowanie i renowacja felg. Serwis Walczykiewicz - Ostrzeszów, Kępno, Syców, Mikstat, Ostrów Wielkopolski i okolice. Zapraszamy!">
    <meta name="keywords" content="wulkanizacja ostrzeszów, serwis opon kępno, geometria 3d syców, lakiernia felg ostrów wielkopolski, piaskowanie ostrzeszów, piaskowanie felg kępno, prostowanie felg mikstat, renowacja felg ostrzeszów, opony kępno, mechanika pojazdowa">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Nowoczesna paleta barw z akcentami cyan/royal blue */
            --main-accent: #0088ff;
            --main-accent-hover: #0066cc;
            --accent-gradient: linear-gradient(135deg, #0088ff 0%, #00d2ff 100%);
            --dark-bg: #0d1117;
            --card-bg: #161b22;
            --card-border: rgba(255, 255, 255, 0.08);
            --light-bg: #f3f5f8;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- SEO TOP BAR --- */
        .seo-top-bar {
            background: var(--accent-gradient);
            color: white;
            text-align: center;
            padding: 10px 5%;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* --- REVEAL ON SCROLL --- */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- SCROLLBAR --- */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--dark-bg); }
        ::-webkit-scrollbar-thumb { background: var(--main-accent); border-radius: 5px; }

        /* --- NAWIGACJA --- */
        header {
            background: rgba(13, 17, 23, 0.85);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border);
        }

        .logo-container { display: flex; flex-direction: column; }
        .logo { font-size: 24px; font-weight: 900; text-transform: uppercase; color: #fff; line-height: 1; letter-spacing: 0.5px; }
        .logo span { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-sub { font-size: 10px; letter-spacing: 1px; font-weight: 700; color: var(--text-muted); margin-top: 5px; text-transform: uppercase; }

        nav { display: flex; align-items: center; }
        nav a {
            color: var(--text-main);
            text-decoration: none;
            margin-left: 20px;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            transition: 0.3s;
            position: relative;
        }
        nav a:not(.nav-call)::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background: var(--accent-gradient);
            transition: width 0.3s ease;
        }
        nav a:not(.nav-call):hover::after {
            width: 100%;
        }
        nav a:hover { color: var(--main-accent); }

        .nav-call {
            background: var(--accent-gradient);
            color: white !important;
            padding: 10px 20px;
            border-radius: 6px;
            transition: background 0.3s, transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 0 15px rgba(0, 136, 255, 0.3);
        }
        .nav-call:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 136, 255, 0.6);
        }

        /* --- TICKER --- */
        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background-color: #06090e;
            padding: 14px 0;
            border-bottom: 1px solid var(--card-border);
        }
        .ticker {
            display: flex;
            width: fit-content;
            animation: ticker-move 35s linear infinite;
            white-space: nowrap;
        }
        .ticker-item {
            flex-shrink: 0;
            padding: 0 60px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
        }
        .ticker-item::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--main-accent);
            border-radius: 50%;
            margin-right: 20px;
            box-shadow: 0 0 10px var(--main-accent);
        }
        @keyframes ticker-move {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* --- HERO --- */
        .hero {
            position: relative;
            background: linear-gradient(180deg, rgba(13, 17, 23, 0.7) 0%, rgba(13, 17, 23, 0.95) 100%), url('opony.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed; 
            padding: 140px 5%;
            display: flex;
            align-items: center;
            min-height: 500px;
            color: white;
        }
        .hero h1 { font-size: 3.5rem; text-transform: uppercase; margin: 0; line-height: 1.15; font-weight: 900; letter-spacing: -1px; }
        .hero h1 span { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .btn-action {
            background: var(--accent-gradient);
            color: white;
            padding: 18px 45px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 900;
            display: inline-block;
            margin-top: 30px;
            transition: 0.3s;
            border: none;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0, 136, 255, 0.4);
        }
        .btn-action:hover { transform: scale(1.03); box-shadow: 0 0 30px rgba(0, 136, 255, 0.7); }

        /* --- SEKCJA OFERTY --- */
        .services-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 30px; 
            padding: 80px 5%; 
            background: var(--dark-bg); 
        }
        .card { 
            background: var(--card-bg); 
            padding: 40px; 
            border: 1px solid var(--card-border);
            border-top: 4px solid var(--main-accent); 
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            transition: 0.3s;
        }
        .card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 20px 40px rgba(0, 136, 255, 0.15); 
            border-color: rgba(0, 136, 255, 0.3);
        }
        .card h3 { 
            margin-top: 0; 
            font-size: 1.5rem; 
            color: #ffffff; 
            text-transform: uppercase; 
            font-weight: 900; 
        }
        .card ul { list-style: none; padding: 0; margin-top: 20px; }
        .card li { 
            padding: 12px 0; 
            border-bottom: 1px solid var(--card-border); 
            font-weight: 500; 
            color: var(--text-muted); 
            font-size: 14px;
            display: flex;
            align-items: center;
        }
        .card li::before {
            content: "✓";
            color: var(--main-accent);
            font-weight: bold;
            margin-right: 15px;
            font-size: 16px;
        }

        /* --- GEOMETRIA 3D --- */
        .geo-section {
            padding: 100px 5%;
            background: linear-gradient(180deg, rgba(13, 17, 23, 0.9) 0%, rgba(13, 17, 23, 0.95) 100%), url('oponynieaktualne.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
        }
        .geo-content {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 60px;
            align-items: center;
        }
        .geo-text-side h2 { font-size: 3rem; font-weight: 900; margin-bottom: 20px; }
        .geo-text-side h2 span { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .geo-f-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-top: 35px;
        }
        .geo-f-item { padding-left: 20px; border-left: 3px solid var(--main-accent); }
        .geo-f-item strong { display: block; text-transform: uppercase; font-size: 14px; color: #fff; margin-bottom: 5px; }
        .geo-f-item p { margin: 0; font-size: 14px; color: var(--text-muted); }
        
        .geo-img-box {
            width: 100%;
            aspect-ratio: 4/3;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            overflow: hidden;
            border-bottom: 4px solid var(--main-accent);
            cursor: pointer;
        }
        .geo-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }
        .geo-img-box:hover img {
            transform: scale(1.05);
        }

        /* --- PROSTOWANIE FELG --- */
        .prostowanie-section {
            padding: 100px 5%;
            background: linear-gradient(180deg, rgba(13, 17, 23, 0.95) 0%, rgba(13, 17, 23, 0.95) 100%), url('tlo2.jpeg');
            background-size: cover;
            background-attachment: fixed;
            color: white;
        }
        .prostowanie-content {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }
        .prostowanie-col {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            border-top: 4px solid var(--main-accent);
        }
        .prostowanie-col h3 {
            font-size: 1.8rem;
            text-transform: uppercase;
            font-weight: 900;
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--main-accent);
        }
        .prostowanie-col p { color: var(--text-muted); font-size: 14px; margin-bottom: 25px; }
        
        .prostowanie-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .prostowanie-list li {
            padding: 12px 0;
            border-bottom: 1px solid var(--card-border);
            font-size: 14px;
            color: var(--text-main);
            display: flex;
            align-items: center;
        }
        .prostowanie-list li::before {
            content: "✓";
            color: var(--main-accent);
            font-weight: bold;
            margin-right: 15px;
            font-size: 16px;
        }

        .prostowanie-img-box {
            width: 100%;
            aspect-ratio: 4/3;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            overflow: hidden;
            border-bottom: 4px solid var(--main-accent);
            cursor: pointer;
        }
        .prostowanie-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }
        .prostowanie-img-box:hover img {
            transform: scale(1.05);
        }

        /* --- PIASKOWANIE --- */
        .piaskowanie-section {
            padding: 100px 5%;
            background: #0b0e14;
            color: var(--text-main);
        }
        .piaskowanie-content {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }
        .piaskowanie-col {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            border-top: 4px solid var(--main-accent);
        }
        .piaskowanie-col h3 {
            font-size: 1.8rem;
            text-transform: uppercase;
            font-weight: 900;
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--main-accent);
        }
        .piaskowanie-col p { color: var(--text-muted); font-size: 14px; margin-bottom: 25px; }
        .piaskowanie-list { list-style: none; padding: 0; margin: 0; }
        .piaskowanie-list li {
            padding: 12px 0;
            border-bottom: 1px solid var(--card-border);
            font-size: 14px;
            color: var(--text-main);
            display: flex;
            align-items: center;
        }
        .piaskowanie-list li::before {
            content: "✓";
            color: var(--main-accent);
            font-weight: bold;
            margin-right: 15px;
            font-size: 16px;
        }
        .piaskowanie-gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* --- LAKIERNIA --- */
        .lakiernia-intro-section { 
            padding: 90px 5%; 
            text-align: center; 
            background: linear-gradient(180deg, rgba(13, 17, 23, 0.95) 0%, rgba(13, 17, 23, 0.98) 100%), url('tlo2.jpeg');
            background-size: cover;
            background-attachment: fixed;
            color: #fff;
        }
        
        .lakiernia-columns {
            display: grid;
            grid-template-columns: 1fr;
            max-width: 800px;
            margin: 0 auto 40px auto;
            text-align: left;
        }
        .lakiernia-col {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            border-top: 4px solid var(--main-accent);
        }
        .lakiernia-col h3 {
            font-size: 2rem;
            text-transform: uppercase;
            font-weight: 900;
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--main-accent);
            text-align: center;
        }

        .wet-paint-list {
            list-style: none;
            padding: 0;
            margin: 0 auto;
            max-width: 650px;
        }
        .wet-paint-list li {
            padding: 12px 0;
            border-bottom: 1px solid var(--card-border);
            font-size: 14px;
            color: var(--text-main);
            display: flex;
            align-items: center;
        }
        .wet-paint-list li::before {
            content: "✓";
            color: var(--main-accent);
            font-weight: bold;
            margin-right: 15px;
            font-size: 16px;
        }

        .btn-gallery {
            background: var(--accent-gradient);
            color: white;
            padding: 16px 36px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 900;
            display: inline-block;
            margin-top: 20px;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 136, 255, 0.3);
        }
        .btn-gallery:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(0, 136, 255, 0.6);
        }

        /* --- STOPKA --- */
        .contact-footer {
            background: #06090e;
            color: white;
            padding: 60px 5% 20px 5%;
            border-top: 1px solid var(--card-border);
        }
        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
        }
        .footer-col h4 { text-transform: uppercase; margin-bottom: 20px; font-weight: 900; font-size: 16px; }
        .footer-col h4 span { color: var(--main-accent); }
        .footer-list { list-style: none; padding: 0; }
        .footer-list li { margin-bottom: 10px; font-size: 14px; color: var(--text-muted); display: flex; justify-content: space-between; }
        
        .status-badge {
            display: inline-block; padding: 6px 12px; border-radius: 4px; font-size: 11px; font-weight: 900;
            text-transform: uppercase; margin-top: 15px;
        }
        .status-open { color: #00ff88; border: 1px solid #00ff88; background: rgba(0,255,136,0.05); }
        .status-closed { color: #ff4757; border: 1px solid #ff4757; background: rgba(255,71,87,0.05); }

        /* --- MODALE --- */
        #lightbox {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 3000; justify-content: center; align-items: center;
        }
        #lightbox img { max-width: 90%; max-height: 85%; border: 2px solid white; border-radius: 8px; }

        .modal-content { background: var(--card-bg); border: 1px solid var(--card-border); padding: 40px; border-radius: 12px; text-align: center; max-width: 400px; width: 90%; position: relative; color: var(--text-main); }
        .phone-box { background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); padding: 15px; border-radius: 8px; margin-bottom: 10px; text-decoration: none; display: block; color: var(--main-accent); font-size: 1.5rem; font-weight: 900; transition: 0.3s; }
        .phone-box:hover { background: rgba(0,136,255,0.1); border-color: var(--main-accent); transform: scale(1.02); }

        .floating-call {
            position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px;
            background: var(--accent-gradient); border-radius: 50%; display: none;
            justify-content: center; align-items: center; z-index: 999; color: white; text-decoration: none; font-size: 24px;
            box-shadow: 0 4px 20px rgba(0, 136, 255, 0.5);
        }

        @media (max-width: 992px) {
            .lakiernia-columns, .prostowanie-content, .geo-content, .piaskowanie-content { grid-template-columns: 1fr; gap: 30px; }
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
            nav a:not(.nav-call) { display: none; }
            .geo-content { text-align: center; }
            .geo-f-item { border-left: none; border-top: 2px solid var(--main-accent); padding-left: 0; padding-top: 15px; }
            .floating-call { display:
