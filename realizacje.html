<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Realizacji Lakierni | Serwis Walczykiewicz Ostrzeszów</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-accent: #0088ff;
            --accent-gradient: linear-gradient(135deg, #0088ff 0%, #00d2ff 100%);
            --dark-bg: #0d1117;
            --card-bg: #161b22;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            background: rgba(13, 17, 23, 0.85);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border);
        }

        .logo { font-size: 24px; font-weight: 900; text-transform: uppercase; color: #fff; text-decoration: none; }
        .logo span { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .btn-back {
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            border: 1px solid var(--card-border);
            padding: 10px 20px;
            border-radius: 6px;
            transition: 0.3s;
        }
        .btn-back:hover { background: rgba(255,255,255,0.05); border-color: var(--main-accent); }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 5%;
        }

        h1 {
            font-size: 2.8rem;
            text-transform: uppercase;
            font-weight: 900;
            text-align: center;
            margin-bottom: 10px;
        }
        h1 span { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .section-title {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 900;
            color: #fff;
            margin-top: 60px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 1.3rem;
        }

        /* --- BEFORE / AFTER SLIDER --- */
        .ba-slider {
            position: relative;
            width: 100%;
            max-width: 550px;
            margin: 0 auto 40px auto;
            overflow: hidden;
            border-radius: 12px;
            aspect-ratio: 1/1;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .ba-img-back { width: 100%; height: 100%; object-fit: cover; display: block; }
        .ba-overlay { position: absolute; top: 0; left: 0; width: 50%; height: 100%; overflow: hidden; z-index: 2; }
        .ba-img-front { position: absolute; top: 0; left: 0; height: 100%; object-fit: cover; display: block; }
        .ba-handle {
            position: absolute;
            top: 0; bottom: 0; left: 50%; width: 4px;
            background: var(--main-accent); cursor: ew-resize; z-index: 10;
        }
        .ba-handle::after {
            content: "◀ ▶";
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 44px; height: 44px;
            background: #fff; border: 3px solid var(--main-accent);
            color: var(--main-accent); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 11px;
        }

        /* --- GALERIE GRID --- */
        .realizacje-grid { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }
        .realizacja-item { 
            position: relative; 
            overflow: hidden; 
            border-radius: 10px; 
            cursor: pointer; 
            border: 1px solid var(--card-border); 
            background: var(--card-bg);
        }
        .realizacja-item img { width: 100%; height: 280px; object-fit: cover; transition: 0.5s; display: block; }
        .realizacja-item:hover img { transform: scale(1.05); }

        #lightbox {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 3000; justify-content: center; align-items: center;
        }
        #lightbox img { max-width: 90%; max-height: 85%; border: 2px solid white; border-radius: 8px; }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid var(--card-border);
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo">WALCZYKIEWICZ <span>SERWIS</span></a>
    <a href="index.html" class="btn-back">← Powrót do strony głównej</a>
</header>

<div class="container">
    <h1>Galeria <span>Realizacji</span></h1>
    <p style="text-align: center; color: var(--text-muted); max-width: 600px; margin: 0 auto 40px auto;">Zobacz przykłady odnowionych felg aluminiowych i stalowych po malowaniu proszkowym i systemowym na mokro.</p>

    <div class="section-title">Metamorfoza: Przed i Po Malowaniu</div>
    <div class="ba-slider" id="beforeAfterSlider">
        <img src="po.jpg" alt="Po malowaniu" class="ba-img-back">
        <div class="ba-overlay" id="sliderOverlay">
            <img src="przed.jpg" alt="Przed malowaniem" class="ba-img-front" id="frontImg">
        </div>
        <div class="ba-handle" id="sliderHandle"></div>
    </div>

    <div class="section-title">Malowanie Proszkowe</div>
    <div class="realizacje-grid">
        <div class="realizacja-item" onclick="expandImage(this)"><img src="1.jpg" alt="Realizacja 1" loading="lazy"></div>
        <div class="realizacja-item" onclick="expandImage(this)"><img src="2.jpg" alt="Realizacja 2" loading="lazy"></div>
        <div class="realizacja-item" onclick="expandImage(this)"><img src="3_new.jpg" alt="Realizacja 3" loading="lazy"></div>
        <div class="realizacja-item" onclick="expandImage(this)"><img src="4.jpg" alt="Realizacja 4" loading="lazy"></div>
        <div class="realizacja-item" onclick="expandImage(this)"><img src="6.jpg" alt="Realizacja 6" loading="lazy"></div>
        <div class="realizacja-item" onclick="expandImage(this)"><img src="7.jpg" alt="Realizacja 7" loading="lazy"></div>
        <div class="realizacja-item" onclick="expandImage(this)"><img src="8.jpg" alt="Realizacja 8" loading="lazy"></div>
        <div class="realizacja-item" onclick="expandImage(this)"><img src="9.jpg" alt="Realizacja 9" loading="lazy"></div>
    </div>

    <div class="section-title">Malowanie na Mokro</div>
    <div class="realizacje-grid" style="max-width: 350px; margin-left: auto; margin-right: auto;">
        <div class="realizacja-item" onclick="expandImage(this)"><img src="5.jpg" alt="Realizacja 5" loading="lazy"></div>
    </div>
</div>

<footer>
    © 2026 Walczykiewicz Serwis Ostrzeszów
</footer>

<div id="lightbox" onclick="this.style.display='none'"><img id="expandedImg" src=""></div>

<script>
    function expandImage(el) { 
        document.getElementById('expandedImg').src = el.querySelector('img').src;
        document.getElementById('lightbox').style.display = 'flex';
    }

    const slider = document.getElementById('beforeAfterSlider');
    const overlay = document.getElementById('sliderOverlay');
    const frontImg = document.getElementById('frontImg');
    const handle = document.getElementById('sliderHandle');
    let isDragging = false;

    function moveSlider(x) {
        if(!slider || !frontImg || !handle || !overlay) return;
        const rect = slider.getBoundingClientRect();
        let position = (x - rect.left) / rect.width;
        if (position < 0) position = 0; if (position > 1) position = 1;
        frontImg.style.width = slider.offsetWidth + 'px';
        handle.style.left = position * 100 + '%';
        overlay.style.width = position * 100 + '%';
    }

    if(slider) {
        slider.addEventListener('mousedown', () => isDragging = true);
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => { if(isDragging) moveSlider(e.clientX); });
        slider.addEventListener('touchstart', () => isDragging = true);
        window.addEventListener('touchend', () => isDragging = false);
        slider.addEventListener('touchmove', (e) => { if(isDragging) moveSlider(e.touches[0].clientX); });
    }

    window.addEventListener('resize', () => { if(frontImg && slider) frontImg.style.width = slider.offsetWidth + 'px'; });
    if(frontImg && slider) frontImg.style.width = slider.offsetWidth + 'px';
</script>

</body>
</html>
